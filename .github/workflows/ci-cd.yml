name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      seed:
        description: "Seed the production database with demo data (only runs if it is empty)"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ek_porichoy
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ek_porichoy
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      PAYER_WEBHOOK_SECRET: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrate + seed CI database
        run: |
          pnpm --filter @ep/db db:migrate
          pnpm --filter @ep/seed exec tsx src/seed.ts
      - run: pnpm build

  deploy:
    name: Deploy to Vercel (${{ github.event_name == 'pull_request' && 'preview' || 'production' }})
    needs: ci
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
      url: ${{ steps.deploy.outputs.url }}
    # The Vercel project's Root Directory is apps/web; the CLI runs from the repo root so the
    # whole pnpm workspace (root node_modules, packages/*) is inside the deploy's file scope.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pull Vercel environment
        run: npx vercel@latest pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Run database migrations (production)
        if: github.event_name != 'pull_request'
        run: |
          set -a; source .vercel/.env.production.local; set +a
          pnpm --filter @ep/db db:migrate

      - name: Seed demo data (manual, only if empty)
        if: github.event_name == 'workflow_dispatch' && inputs.seed
        run: |
          set -a; source .vercel/.env.production.local; set +a
          export DATABASE_URL="${DATABASE_URL_UNPOOLED:-$DATABASE_URL}"
          pnpm --filter @ep/seed exec tsx src/seed.ts

      - name: Build
        run: npx vercel@latest build ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(npx vercel@latest deploy --prebuilt ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### 🚀 Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              ...context.repo, issue_number: context.issue.number,
              body: `Preview deployed: ${{ steps.deploy.outputs.url }}`,
            })
